# build.yml — 在 GitHub Actions(macOS) 上把 bypass.m 编译成 iOS arm64 动态库
#
# 用法：
#   1. 把这个文件放到仓库 .github/workflows/build.yml
#   2. 把 bypass.m 一起提交进仓库
#   3. 仓库 Actions 页面 -> 手动运行 "Build iOS dylib"（或 push 触发）
#   4. 跑完在运行记录底部 Artifacts 里下载 bypass.dylib
#
# 注意：
#   - 源文件必须用 .m 后缀（不是 .c），并加 -fobjc-arc，
#     否则 ObjC 头 / objc_msgSend 会报错（你之前编译踩的坑）。
#   - 产物是 iphoneos arm64 动态库，已做 ad-hoc 签名。
#   - 若只需编译，用默认 input；若还想对靶场 dylib 打二进制补丁，
#     可单独跑 build-patched 这个 job（仓库里放 patch_dylib.py 和原 dylib）。

name: Build iOS dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      source:
        description: "要编译的 ObjC 源文件(仓库内相对路径)"
        required: false
        default: "bypass.m"
      xcode:
        description: "Xcode 版本(留空用默认, 如 16.4)"
        required: false
        default: ""

jobs:
  # ---------- job 1: 编译 bypass.m -> bypass.dylib ----------
  build-bypass:
    name: Compile bypass.dylib (iphoneos arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        if: ${{ inputs.xcode != '' }}
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode }}.app

      - name: Verify iOS SDK / clang
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version | head -n1

      - name: Compile dynamic library (arm64, ObjC, ARC)
        run: |
          SRC="${{ inputs.source != '' && inputs.source || 'bypass.m' }}"
          test -f "$SRC" || { echo "source not found: $SRC"; exit 1; }
          case "$SRC" in
            *.m)  EXTRA="-fobjc-arc" ;;
            *.c)  EXTRA="" ;;
            *)    EXTRA="" ;;
          esac
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -framework Foundation \
            $EXTRA \
            -o bypass.dylib \
            "$SRC"
          ls -lh bypass.dylib
          file bypass.dylib

      - name: Ad-hoc sign
        run: codesign --force --sign - bypass.dylib

      - name: Upload bypass.dylib
        uses: actions/upload-artifact@v4
        with:
          name: bypass.dylib
          path: bypass.dylib
          if-no-files-found: error

  # ---------- job 2: 直接对靶场 dylib 打补丁 ----------
  # 手动触发时运行：把老师给的"原授权靶场 dylib"（仓库里或自动从课程仓库下载）
  # 打成破解版 patched.dylib，再替换回 IPA 里重新签名。不打运行时补丁，不会闪退。
  build-patched:
    name: Patch target dylib -> patched.dylib
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original target dylib
        run: |
          if ls *.dylib >/dev/null 2>&1; then
            echo "use repo dylib"
          else
            echo "downloading target..."
            curl -sL -o target.dylib \
              "https://github.com/isisks29/ground/raw/main/Zhuanz-%E7%AC%AC%E5%9B%9B%E8%AF%BE-%E6%8E%88%E6%9D%83%E9%9D%B6%E5%9C%BA.dylib"
          fi

      - name: Patch
        run: |
          TGT=$(ls -1 *.dylib | head -n1)
          echo "patching: $TGT"
          python3 patch_dylib.py "$TGT" -o patched.dylib

      - name: Upload patched.dylib
        uses: actions/upload-artifact@v4
        with:
          name: patched.dylib
          path: patched.dylib
          if-no-files-found: error
