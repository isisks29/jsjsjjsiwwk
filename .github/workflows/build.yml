name: Build iOS dylib

on:
  workflow_dispatch:
    inputs:
      source:
        description: "要编译的 ObjC 源文件(仓库内相对路径)"
        required: false
        default: "bypass.m"
      xcode:
        description: "Xcode 版本(留空用默认, 如 16.4)"
        required: false
        default: ""
  push:
    branches: [ "main", "master" ]
    paths:
      - "bypass.m"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-ios-dylib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bypass:
    name: Compile bypass.dylib (iphoneos arm64)
    # 用你账号里可用的标签；不要写具体版本号
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        if: ${{ inputs.xcode != '' }}
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode }}.app

      - name: Compile dynamic library (arm64, ObjC, ARC)
        run: |
          SRC="${{ inputs.source != '' && inputs.source || 'bypass.m' }}"
          test -f "$SRC" || { echo "source not found: $SRC"; exit 1; }
          case "$SRC" in
            *.m) EXTRA="-fobjc-arc" ;;
            *)   EXTRA="" ;;
          esac
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O0 -g0 \
            -mios-version-min=13.0 \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -Wno-deprecated-declarations \
            $EXTRA \
            -o bypass.dylib \
            "$SRC"
          ls -lh bypass.dylib
          file bypass.dylib

      - name: Ad-hoc sign
        run: codesign --force --sign - bypass.dylib

      # 兜底：常规 Artifacts（下载一定是 zip）
      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: bypass.dylib
          path: bypass.dylib
          if-no-files-found: error

      # 正题：挂到 Release 附件，下载即 .dylib；没开写权限也不会让构建失败
      - name: Publish direct .dylib asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" bypass.dylib \
            --title "$TAG" \
            --notes "自动构建 · ${GITHUB_SHA:0:7}" \
            --target "${GITHUB_SHA}"
