name: build-bypass-ios
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 编译 iOS dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 -fobjc-arc \
            -mios-version-min=13.0 bypass.c -o bypass.dylib
          codesign -s - bypass.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: bypass-ios.dylib
          path: bypass.dylib
